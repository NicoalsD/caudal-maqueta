; CAUDAL maqueta: firmware del ESP32 de la maqueta física.
; Compilar: pio run -e esp32dev. Pruebas de la lógica pura: pio test -e native.

[platformio]
default_envs = esp32dev

[env]
; Versiones fijadas. ArduinoJson solo parsea JSON; funciona igual en el host y en el ESP32.
lib_deps =
    bblanchon/ArduinoJson@7.2.1
lib_ldf_mode = chain

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${env.lib_deps}

[env:native]
platform = native
test_framework = unity
lib_deps = ${env.lib_deps}
; El firmware (src/) usa Arduino; las pruebas solo cubren lib/.
test_build_src = no
