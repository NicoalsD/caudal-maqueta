; CAUDAL maqueta: firmware del Arduino UNO conectado por USB al puente de caudal-simulador.
; Compilar: pio run. Subir: pio run -t upload. Monitor: pio device monitor.
; El sketch también abre en el Arduino IDE (carpeta caudal_uno/).

[platformio]
src_dir = caudal_uno

[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@1.2.2
